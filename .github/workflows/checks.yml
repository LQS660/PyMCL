name: checks

on:
  push:
  pull_request:

jobs:
  qt-parent:
    name: Qt 控件漏传 parent 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 纯标准库，不导入 Qt，所以这一步不用装任何依赖，几秒就出结果
      - run: python scripts/check_qt_parent.py

  tool-parity:
    name: 跨端 AI 工具集差异报告（只报告不挡门）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 桌面 36 / Android 19 的差集每次可见（含 ask_user 缺席），对齐为后续事项
      - run: python scripts/check_tool_parity.py

  tests:
    name: pytest
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PySide6 即使跑 offscreen 也要这几个系统库才 import 得起来
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: pip install -r requirements.txt pytest pytest-timeout
      - run: pytest tests -q --timeout=300
